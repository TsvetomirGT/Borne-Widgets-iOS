name: BorneWidgets
options:
  bundleIdPrefix: dev.borne
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BorneKit:
    path: BorneKit
targets:
  BorneWidgets:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).bornewidgets
        PRODUCT_NAME: Borne
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Borne
        BorneAppGroup: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: Borne uses your location to show local weather in your widgets.
        NSCalendarsFullAccessUsageDescription: Borne shows your upcoming events in its Calendar widgets.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/BorneWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - package: BorneKit
        product: BorneCore
      - package: BorneKit
        product: BorneDesigns
      - target: BorneWidgetsExtension
        embed: true
  BorneWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).bornewidgets.widgets
        PRODUCT_NAME: BorneWidgetsExtension
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Borne Widgets
        BorneAppGroup: $(APP_GROUP_ID)
        NSCalendarsFullAccessUsageDescription: Borne shows your upcoming events in its Calendar widgets.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetExtension/BorneWidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - package: BorneKit
        product: BorneCore
      - package: BorneKit
        product: BorneDesigns
schemes:
  BorneWidgets:
    build:
      targets:
        BorneWidgets: all
        BorneWidgetsExtension: all
    run:
      config: Debug
